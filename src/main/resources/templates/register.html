<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Project Selection System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body class="auth-body">

<div class="auth-shell">
    <div class="auth-card">

        <div class="auth-brand">
            <div class="auth-brand-icon">🎓</div>
            <div>
                <h1>Project Selection System</h1>
                <p>Create your account to get started</p>
            </div>
        </div>

        <div class="auth-header">
            <h2>Register</h2>
            <p>Use your university email to create an account.</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" method="post" class="auth-form">

            <div class="modern-form-group">
                <label for="name">Full Name</label>
                <input id="name"
                       type="text"
                       name="name"
                       class="modern-input"
                       placeholder="Your full name"
                       required>
            </div>

            <div class="modern-form-group">
                <label for="email">Email</label>
                <input id="email"
                       type="email"
                       name="email"
                       class="modern-input"
                       placeholder="your@student.xjtlu.edu.cn or your@xjtlu.edu.cn"
                       required>
            </div>

            <div class="modern-form-group">
                <label for="password">Password</label>
                <input id="password"
                       type="password"
                       name="password"
                       class="modern-input"
                       placeholder="At least 8 chars, with upper/lowercase and a digit"
                       required
                       minlength="8">
                <p id="password-hint" class="password-hint" style="display:none;margin-top:6px;font-size:0.85rem;">
                    Must be at least 8 characters and include an uppercase letter, a lowercase letter, and a digit.
                </p>
            </div>

            <div class="modern-form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input id="confirmPassword"
                       type="password"
                       name="confirmPassword"
                       class="modern-input"
                       placeholder="Re-enter your password"
                       required
                       minlength="8">
                <p id="confirm-hint" class="password-hint" style="display:none;margin-top:6px;font-size:0.85rem;">
                    Passwords do not match.
                </p>
            </div>

            <button type="submit" class="modern-btn modern-btn-primary auth-submit-btn">
                Register
            </button>
        </form>

        <div class="auth-links">
            <span>Already have an account? <a th:href="@{/login}">Login here</a></span>
        </div>

    </div>
</div>

<script>
(function () {
    var passwordInput = document.getElementById('password');
    var confirmInput = document.getElementById('confirmPassword');
    var hint = document.getElementById('password-hint');
    var confirmHint = document.getElementById('confirm-hint');
    var form = passwordInput.closest('form');

    function isStrong(pw) {
        return pw.length >= 8 && /[a-z]/.test(pw) && /[A-Z]/.test(pw) && /\d/.test(pw);
    }

    function validatePassword() {
        var pw = passwordInput.value;
        if (pw.length === 0) {
            hint.style.display = 'none';
            return true;
        }
        hint.style.display = 'block';
        if (isStrong(pw)) {
            hint.style.color = '#16a34a';
            return true;
        } else {
            hint.style.color = '#dc2626';
            return false;
        }
    }

    function validateConfirm() {
        var cp = confirmInput.value;
        if (cp.length === 0) {
            confirmHint.style.display = 'none';
            return true;
        }
        confirmHint.style.display = 'block';
        if (cp === passwordInput.value) {
            confirmHint.style.color = '#16a34a';
            confirmHint.textContent = 'Passwords match.';
            return true;
        } else {
            confirmHint.style.color = '#dc2626';
            confirmHint.textContent = 'Passwords do not match.';
            return false;
        }
    }

    passwordInput.addEventListener('input', function () { validatePassword(); validateConfirm(); });
    passwordInput.addEventListener('blur', validatePassword);
    confirmInput.addEventListener('input', validateConfirm);
    confirmInput.addEventListener('blur', validateConfirm);

    form.addEventListener('submit', function (e) {
        if (!validatePassword() || !validateConfirm()) {
            e.preventDefault();
        }
    });
})();
</script>
</body>
</html>
