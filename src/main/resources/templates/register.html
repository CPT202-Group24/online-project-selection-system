<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - Project Selection System</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
</head>
<body class="auth-body">

<div class="auth-shell">
    <div class="auth-card">

        <div class="auth-brand">
            <div class="auth-brand-icon">🎓</div>
            <div>
                <h1>Project Selection System</h1>
                <p>Create your account to get started</p>
            </div>
        </div>

        <div class="auth-header">
            <h2>Register</h2>
            <p>Use your university email to create an account.</p>
        </div>

        <div th:if="${errorMessage}" class="alert alert-error" th:text="${errorMessage}"></div>

        <form th:action="@{/register}" method="post" class="auth-form">

            <div class="modern-form-group">
                <label for="name">Full Name</label>
                <input id="name"
                       type="text"
                       name="name"
                       class="modern-input"
                       placeholder="Your full name"
                       required>
            </div>

            <div class="modern-form-group">
                <label for="email">Email</label>
                <div style="display:flex;gap:8px;">
                    <input id="email"
                           type="email"
                           name="email"
                           class="modern-input"
                           placeholder="your@student.xjtlu.edu.cn or your@xjtlu.edu.cn"
                           required
                           style="flex:1;">
                    <button type="button" id="sendCodeBtn" class="modern-btn modern-btn-primary" style="white-space:nowrap;min-width:120px;">
                        Send Code
                    </button>
                </div>
            </div>

            <select class="modern-select" aria-hidden="true" tabindex="-1" style="display:none;">
                <option value="">Reusable select component marker</option>
            </select>

            <div class="modern-form-group" id="verificationCodeGroup" style="display:none;">
                <label for="verificationCode">Verification Code</label>
                <input id="verificationCode"
                       type="text"
                       name="verificationCode"
                       class="modern-input"
                       placeholder="Enter 6-digit code"
                       maxlength="6"
                       pattern="\d{6}"
                       inputmode="numeric"
                       required>
            </div>
            <p id="code-hint" class="password-hint" style="display:none;margin-top:6px;margin-bottom:12px;font-size:0.85rem;"></p>

            <div class="modern-form-group">
                <label for="password">Password</label>
                <input id="password"
                       type="password"
                       name="password"
                       class="modern-input"
                       placeholder="At least 8 chars, with upper/lowercase and a digit"
                       required
                       minlength="8">
                <p id="password-hint" class="password-hint" style="display:none;margin-top:6px;font-size:0.85rem;">
                    Must be at least 8 characters and include an uppercase letter, a lowercase letter, and a digit.
                </p>
            </div>

            <div class="modern-form-group">
                <label for="confirmPassword">Confirm Password</label>
                <input id="confirmPassword"
                       type="password"
                       name="confirmPassword"
                       class="modern-input"
                       placeholder="Re-enter your password"
                       required
                       minlength="8">
                <p id="confirm-hint" class="password-hint" style="display:none;margin-top:6px;font-size:0.85rem;">
                    Passwords do not match.
                </p>
            </div>

            <button type="submit" class="modern-btn modern-btn-primary auth-submit-btn">
                Register
            </button>
        </form>

        <div class="auth-links">
            <span>Already have an account? <a th:href="@{/login}">Login here</a></span>
        </div>

    </div>
</div>

<script>
(function () {
    var passwordInput = document.getElementById('password');
    var confirmInput = document.getElementById('confirmPassword');
    var hint = document.getElementById('password-hint');
    var confirmHint = document.getElementById('confirm-hint');
    var form = passwordInput.closest('form');

    // ── Password validation ──────────────────────────────────────────

    function isStrong(pw) {
        return pw.length >= 8 && /[a-z]/.test(pw) && /[A-Z]/.test(pw) && /\d/.test(pw);
    }

    function validatePassword() {
        var pw = passwordInput.value;
        if (pw.length === 0) {
            hint.style.display = 'none';
            return true;
        }
        hint.style.display = 'block';
        if (isStrong(pw)) {
            hint.style.color = '#16a34a';
            return true;
        } else {
            hint.style.color = '#dc2626';
            return false;
        }
    }

    function validateConfirm() {
        var cp = confirmInput.value;
        if (cp.length === 0) {
            confirmHint.style.display = 'none';
            return true;
        }
        confirmHint.style.display = 'block';
        if (cp === passwordInput.value) {
            confirmHint.style.color = '#16a34a';
            confirmHint.textContent = 'Passwords match.';
            return true;
        } else {
            confirmHint.style.color = '#dc2626';
            confirmHint.textContent = 'Passwords do not match.';
            return false;
        }
    }

    passwordInput.addEventListener('input', function () { validatePassword(); validateConfirm(); });
    passwordInput.addEventListener('blur', validatePassword);
    confirmInput.addEventListener('input', validateConfirm);
    confirmInput.addEventListener('blur', validateConfirm);

    // ── Verification code ────────────────────────────────────────────

    var sendBtn = document.getElementById('sendCodeBtn');
    var codeGroup = document.getElementById('verificationCodeGroup');
    var codeHint = document.getElementById('code-hint');
    var emailInput = document.getElementById('email');
    var countdown = null;

    sendBtn.addEventListener('click', function () {
        var email = emailInput.value.trim();
        if (!email) {
            showCodeHint('Please enter your email first.', '#dc2626');
            return;
        }

        sendBtn.disabled = true;
        sendBtn.textContent = 'Sending...';

        var csrfToken = document.querySelector('meta[name="_csrf"]').content;
        var csrfHeader = document.querySelector('meta[name="_csrf_header"]').content;

        fetch('/api/send-verification-code', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/x-www-form-urlencoded',
                [csrfHeader]: csrfToken
            },
            body: 'email=' + encodeURIComponent(email)
        })
        .then(function (r) { return r.json(); })
        .then(function (data) {
            if (data.error) {
                showCodeHint(data.error, '#dc2626');
                sendBtn.disabled = false;
                sendBtn.textContent = 'Send Code';
            } else {
                codeGroup.style.display = 'block';
                showCodeHint('Code sent! Check your inbox.', '#16a34a');
                startCountdown();
            }
        })
        .catch(function () {
            showCodeHint('Failed to send code. Try again.', '#dc2626');
            sendBtn.disabled = false;
            sendBtn.textContent = 'Send Code';
        });
    });

    function showCodeHint(msg, color) {
        codeHint.style.display = 'block';
        codeHint.textContent = msg;
        codeHint.style.color = color;
    }

    function startCountdown() {
        var seconds = 60;
        sendBtn.textContent = seconds + 's';
        countdown = setInterval(function () {
            seconds--;
            if (seconds <= 0) {
                clearInterval(countdown);
                sendBtn.disabled = false;
                sendBtn.textContent = 'Resend';
            } else {
                sendBtn.textContent = seconds + 's';
            }
        }, 1000);
    }

    // ── Form submit ──────────────────────────────────────────────────

    form.addEventListener('submit', function (e) {
        var ok = validatePassword() && validateConfirm();
        if (!ok) {
            e.preventDefault();
        }
    });
})();
</script>
</body>
</html>
