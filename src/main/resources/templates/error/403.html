<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>403 Forbidden — Project Selection System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
        html, body {
            height: 100%; background: #0a1220;
            font-family: 'Inter', system-ui, sans-serif;
        }
        .pss-error-page {
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 40px 24px; position: relative; overflow: hidden;
        }
        .pss-orb {
            position: absolute; border-radius: 50%; pointer-events: none;
            filter: blur(80px); opacity: .08;
        }
        .pss-orb-1 { width: 400px; height: 400px; background: #7f1d1d; top: -80px; right: -60px; }
        .pss-orb-2 { width: 300px; height: 300px; background: #c8a23a; bottom: -40px; left: -60px; }

        .pss-error-card {
            position: relative; z-index: 1;
            text-align: center; max-width: 480px; width: 100%;
        }
        .pss-error-code {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(100px, 18vw, 160px);
            font-weight: 900; color: transparent;
            -webkit-text-stroke: 1.5px rgba(200,162,58,.35);
            line-height: 1; letter-spacing: -.04em;
            margin-bottom: 8px; user-select: none;
        }
        .pss-error-divider {
            width: 48px; height: 1.5px; background: #c8a23a;
            margin: 0 auto 24px; opacity: .6;
        }
        .pss-error-title {
            font-family: 'Playfair Display', Georgia, serif;
            font-size: clamp(22px, 4vw, 32px); font-weight: 700;
            color: #f0ece4; margin-bottom: 16px; letter-spacing: -.02em;
        }
        .pss-error-desc {
            font-size: 14.5px; color: rgba(240,236,228,.55); line-height: 1.7;
            margin-bottom: 36px;
        }
        .pss-error-actions { display: flex; align-items: center; justify-content: center; gap: 12px; flex-wrap: wrap; }
        .pss-btn-primary {
            display: inline-flex; align-items: center; gap: 7px;
            background: #c8a23a; color: #0a1220; text-decoration: none;
            font-size: 14px; font-weight: 700; padding: 12px 24px; border-radius: 10px;
            transition: background .2s;
        }
        .pss-btn-primary:hover { background: #d4ae45; }
        .pss-btn-outline {
            display: inline-flex; align-items: center; gap: 7px;
            background: rgba(255,255,255,.06); color: rgba(240,236,228,.7);
            text-decoration: none; font-size: 13.5px; font-weight: 600;
            padding: 11px 20px; border-radius: 10px;
            border: 1px solid rgba(255,255,255,.1); transition: background .2s;
        }
        .pss-btn-outline:hover { background: rgba(255,255,255,.1); color: #f0ece4; }
    </style>
</head>
<body>
<div class="pss-error-page">
    <div class="pss-orb pss-orb-1"></div>
    <div class="pss-orb pss-orb-2"></div>

    <div class="pss-error-card">
        <div class="pss-error-code">403</div>
        <div class="pss-error-divider"></div>
        <h1 class="pss-error-title">Access Denied</h1>
        <p class="pss-error-desc">
            You don't have permission to access this page. Please log in with an authorised account or return to the homepage.
        </p>
        <div class="pss-error-actions">
            <a th:href="@{/login}" class="pss-btn-primary">
                <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
                Back to Login
            </a>
            <a href="javascript:history.back()" class="pss-btn-outline">Go Back</a>
        </div>
    </div>
</div>
</body>
</html>
