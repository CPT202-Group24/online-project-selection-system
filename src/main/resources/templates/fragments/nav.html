<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<body>

<nav th:fragment="sharedNav" class="pss-nav" role="navigation" aria-label="Main navigation">

<style>
/* PSS Top Navigation — v2 */
@import url('https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700&family=Inter:wght@400;500;600&display=swap');

.pss-nav *{box-sizing:border-box;margin:0;padding:0;}

.pss-nav{
    position:sticky;top:0;z-index:200;
    background:#0a1220;
    height:64px;padding:0 32px;
    display:flex;align-items:center;gap:0;
    box-shadow:0 1px 0 rgba(200,162,58,.1),0 2px 24px rgba(0,0,0,.3);
    font-family:'Inter',system-ui,sans-serif;
}

/* Brand */
.pss-brand{
    display:flex;align-items:center;gap:10px;
    text-decoration:none;margin-right:40px;flex-shrink:0;
}
.pss-brand-mark{
    width:34px;height:34px;
    border:1.5px solid rgba(200,162,58,.4);
    border-radius:8px;
    display:flex;align-items:center;justify-content:center;
    font-family:'Playfair Display',Georgia,serif;
    font-size:14px;font-weight:700;
    color:#c8a23a;letter-spacing:-0.5px;
    flex-shrink:0;
}
.pss-brand-label{
    font-family:'Playfair Display',Georgia,serif;
    font-size:17px;font-weight:700;color:#fff;
    letter-spacing:0.01em;line-height:1.1;
}
.pss-brand-sub{
    display:block;
    font-family:'Inter',sans-serif;
    font-size:10px;font-weight:500;
    color:rgba(200,162,58,.6);
    letter-spacing:0.1em;text-transform:uppercase;
    margin-top:2px;
}

/* Nav links */
.pss-links{display:flex;align-items:center;gap:2px;flex:1;}
.pss-links span{display:contents;}

.pss-link{
    display:inline-flex;align-items:center;gap:6px;
    font-family:'Inter',sans-serif;
    font-size:13px;font-weight:500;
    color:rgba(255,255,255,.52);
    text-decoration:none;
    padding:6px 13px;border-radius:6px;
    transition:color .15s,background .15s;
    white-space:nowrap;position:relative;
}
.pss-link:hover{color:#fff;background:rgba(255,255,255,.06);}
.pss-link.pss-active{
    color:#c8a23a;
    background:rgba(200,162,58,.09);
}
.pss-link.pss-active::after{
    content:'';
    position:absolute;bottom:3px;
    left:13px;right:13px;
    height:1.5px;background:#c8a23a;
    border-radius:2px;opacity:.75;
}

/* Notification badge */
.pss-nb-wrap{position:relative;display:inline-flex;}
.pss-nb{
    position:absolute;top:-6px;right:-7px;
    min-width:16px;height:16px;padding:0 4px;
    border-radius:99px;
    background:#d64035;color:#fff;
    font-size:10px;font-weight:700;line-height:16px;
    text-align:center;font-family:'Inter',sans-serif;
    pointer-events:none;
}

/* Right section */
.pss-right{
    display:flex;align-items:center;gap:14px;
    margin-left:auto;
    padding-left:28px;
    border-left:1px solid rgba(255,255,255,.07);
}
.pss-user{display:flex;align-items:center;gap:9px;}
.pss-avatar{
    width:28px;height:28px;border-radius:50%;
    background:rgba(200,162,58,.12);
    border:1.5px solid rgba(200,162,58,.3);
    display:flex;align-items:center;justify-content:center;
    font-family:'Inter',sans-serif;
    font-size:11px;font-weight:700;color:#c8a23a;
    flex-shrink:0;
}
.pss-email{
    font-family:'Inter',sans-serif;
    font-size:12.5px;font-weight:500;
    color:rgba(255,255,255,.42);
    max-width:180px;overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;
}
.pss-out-form{margin:0;}
.pss-out-btn{
    font-family:'Inter',sans-serif;
    font-size:11px;font-weight:600;
    color:rgba(255,255,255,.38);
    background:transparent;
    border:1px solid rgba(255,255,255,.1);
    border-radius:6px;padding:5px 13px;
    cursor:pointer;
    letter-spacing:0.06em;text-transform:uppercase;
    transition:color .15s,border-color .15s,background .15s;
}
.pss-out-btn:hover{
    color:#fff;
    border-color:rgba(255,255,255,.22);
    background:rgba(255,255,255,.04);
}

@media(max-width:900px){
    .pss-nav{padding:0 16px;height:56px;}
    .pss-brand-label,.pss-brand-sub{display:none;}
    .pss-brand{margin-right:16px;}
    .pss-link{padding:6px 9px;font-size:12px;}
    .pss-email{display:none;}
}
</style>

    <!-- Brand -->
    <a th:href="@{/dashboard}" class="pss-brand">
        <div class="pss-brand-mark">PSS</div>
        <div>
            <span class="pss-brand-label">Project Selection</span>
            <span class="pss-brand-sub">XJTLU · Portal</span>
        </div>
    </a>

    <!-- Role-based nav links -->
    <div class="pss-links">

        <span sec:authorize="hasAuthority('student')">
            <a th:href="@{/student/dashboard}"    class="pss-link" data-ps="/student/dashboard">Dashboard</a>
            <a th:href="@{/student/topics}"       class="pss-link" data-ps="/student/topics">Topics</a>
            <a th:href="@{/student/applications/my}" class="pss-link" data-ps="/student/applications">My Applications</a>
        </span>

        <span sec:authorize="hasAuthority('teacher')">
            <a th:href="@{/teacher/dashboard}"  class="pss-link" data-ps="/teacher/dashboard">Dashboard</a>
            <a th:href="@{/teacher/approvals}"  class="pss-link" data-ps="/teacher/approvals">Approvals</a>
            <a th:href="@{/teacher/projects}"   class="pss-link" data-ps="/teacher/projects">My Projects</a>
        </span>

        <span sec:authorize="hasAuthority('admin')">
            <a th:href="@{/admin/dashboard}"  class="pss-link" data-ps="/admin/dashboard">Dashboard</a>
            <a th:href="@{/admin/users}"      class="pss-link" data-ps="/admin/users">Users</a>
            <a th:href="@{/admin/projects}"   class="pss-link" data-ps="/admin/projects">Projects</a>
        </span>

        <span sec:authorize="isAuthenticated()">
            <a th:href="@{/notifications}" class="pss-link" data-ps="/notifications">
                <span class="pss-nb-wrap">
                    Notifications
                    <span id="sharedNotificationBadge" class="pss-nb" style="display:none;">0</span>
                </span>
            </a>
        </span>

        <span sec:authorize="isAuthenticated()">
            <a th:href="@{/profile}" class="pss-link" data-ps="/profile">Profile</a>
        </span>

    </div>

    <!-- User info + logout -->
    <div class="pss-right" sec:authorize="isAuthenticated()">
        <div class="pss-user">
            <div class="pss-avatar" id="pss-avatar">?</div>
            <span class="pss-email" sec:authentication="name"></span>
        </div>
        <form th:action="@{/logout}" method="post" class="pss-out-form">
            <button type="submit" class="pss-out-btn">Sign Out</button>
        </form>
    </div>

    <script>
    (function(){
        // Active link highlight
        var p = window.location.pathname;
        document.querySelectorAll('.pss-link[data-ps]').forEach(function(a){
            var dp = a.getAttribute('data-ps');
            if(dp && (p === dp || p.startsWith(dp + '/'))){
                a.classList.add('pss-active');
            }
        });

        // Avatar initial from email
        var emailEl = document.querySelector('.pss-email');
        var avatarEl = document.getElementById('pss-avatar');
        if(emailEl && avatarEl){
            var email = (emailEl.textContent || '').trim();
            avatarEl.textContent = email ? email.charAt(0).toUpperCase() : '?';
        }

        // Notification unread badge
        var badge = document.getElementById('sharedNotificationBadge');
        if(!badge) return;
        fetch('/api/notifications/unread-count', {credentials:'same-origin'})
            .then(function(r){ if(!r.ok) throw 0; return r.json(); })
            .then(function(d){
                var n = Number(d.unreadCount || 0);
                if(n > 0){ badge.textContent = String(n); badge.style.display = 'inline-block'; }
                else { badge.style.display = 'none'; }
            })
            .catch(function(){ badge.style.display = 'none'; });
    })();
    </script>

</nav>

</body>
</html>
