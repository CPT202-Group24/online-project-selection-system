<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password — Project Selection System</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,700;0,900;1,400;1,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <meta name="_csrf" th:content="${_csrf.token}">
    <meta name="_csrf_header" th:content="${_csrf.headerName}">
    <style>
        html, body.auth-body { margin: 0 !important; padding: 0 !important; }
        .auth-split { display: flex !important; min-height: 100vh !important; }

        @keyframes lp-orb1 {
            0%, 100% { transform: translate(0,0) scale(1);      opacity:.68; }
            38%       { transform: translate(7%,11%) scale(1.09); opacity:.48; }
            68%       { transform: translate(-4%,7%) scale(.95); opacity:.58; }
        }
        @keyframes lp-orb2 {
            0%, 100% { transform: translate(0,0) scale(1);         opacity:.36; }
            52%       { transform: translate(-9%,-12%) scale(1.13); opacity:.20; }
        }

        .auth-panel-left {
            flex: 0 0 52% !important;
            background-color: #0a1220 !important;
            background-image: none !important;
            position: relative; overflow: hidden; display: flex;
        }
        .auth-panel-left::before {
            content:''; position:absolute; top:-22%; left:-12%;
            width:72%; height:72%;
            background:radial-gradient(ellipse,rgba(46,78,196,.52) 0%,transparent 68%);
            border-radius:50%; filter:blur(62px);
            animation:lp-orb1 13s ease-in-out infinite;
            pointer-events:none; z-index:0;
        }
        .auth-panel-left::after {
            content:''; position:absolute; bottom:-12%; right:-8%;
            width:62%; height:56%;
            background:radial-gradient(ellipse,rgba(20,52,150,.36) 0%,transparent 68%);
            border-radius:50%; filter:blur(54px);
            animation:lp-orb2 17s ease-in-out infinite;
            pointer-events:none; z-index:0;
        }
        .auth-panel-left-inner {
            position:relative; z-index:1; flex:1;
            display:flex; flex-direction:column; min-height:100vh;
            padding:52px 60px !important;
        }
        .auth-brand-header { flex-shrink:0; }
        .auth-institution-tag {
            display:inline-block !important;
            border:1.5px solid rgba(200,162,58,.72) !important;
            color:#c8a23a !important; background:transparent !important;
            font-size:11px !important; font-weight:700 !important;
            letter-spacing:.13em !important; padding:5px 16px !important;
            border-radius:999px !important; text-transform:uppercase !important;
            font-family:'Inter',sans-serif !important;
        }
        .auth-hero {
            flex:1; display:flex; flex-direction:column;
            justify-content:center; padding:40px 0 24px;
        }
        .auth-hero-title {
            margin:0 0 20px;
            font-family:'Playfair Display',Georgia,serif;
            display:flex; flex-direction:column;
            line-height:.92; letter-spacing:-.025em;
        }
        .auth-hero-project  { display:block; font-size:clamp(60px,6.6vw,94px);  font-weight:900; color:#e6dfd4; }
        .auth-hero-selection{ display:block; font-size:clamp(70px,7.8vw,112px); font-style:italic; font-weight:700; color:#c8a23a; }
        .auth-hero-system   { display:block; font-size:clamp(54px,6vw,88px);    font-weight:700; color:#36506e; }
        .auth-hero-desc {
            margin:0; font-size:14px; line-height:1.74;
            color:rgba(255,255,255,.34); max-width:35ch;
            font-family:'Inter',sans-serif;
        }
        .auth-panel-footer { flex-shrink:0; }
        .auth-legal {
            font-size:10.5px; color:rgba(120,160,205,.28);
            margin:0; font-family:'Inter',sans-serif;
        }

        .auth-panel-right {
            flex:1 !important; background-color:#f3f2ef !important;
            background-image:none !important;
            box-shadow:-1px 0 0 rgba(0,0,0,.06) !important;
            display:flex !important; padding:0 56px !important;
            overflow-y:auto !important;
        }
        .auth-form-region {
            width:100%; max-width:390px;
            margin:auto; padding:48px 0;
        }
        .auth-form-accent {
            display:flex; align-items:center; gap:12px; margin-bottom:20px;
        }
        .auth-form-accent-line {
            width:32px; height:2px; background:#c8a23a;
            border-radius:1px; flex-shrink:0;
        }
        .auth-form-accent-text {
            font-size:10.5px; font-weight:700; letter-spacing:.13em;
            text-transform:uppercase; color:#c8a23a;
            font-family:'Inter',sans-serif;
        }
        .auth-form-head { margin-bottom:28px; }
        .auth-form-head h2 {
            margin:0 0 8px !important;
            font-family:'Playfair Display',Georgia,serif !important;
            font-size:38px !important; font-weight:700 !important;
            color:#0a1220 !important; letter-spacing:-.028em !important;
            line-height:1.05 !important;
        }
        .auth-form-head p {
            margin:0 !important; font-size:13.5px; color:#6a7888;
            line-height:1.6; font-family:'Inter',sans-serif;
        }

        .auth-notice {
            display:flex; align-items:flex-start; gap:10px;
            padding:12px 16px; font-size:13px; line-height:1.52;
            margin-bottom:22px; border-width:1px; border-style:solid;
            border-radius:10px; font-family:'Inter',sans-serif;
        }
        .auth-notice-icon { flex-shrink:0; margin-top:2px; }
        .auth-notice-info    { background:#e5eff9; color:#1a3e6a; border-color:#bad0eb; }
        .auth-notice-success { background:#e7f8ee; color:#14482a; border-color:#aedbbf; }

        .auth-form { display:flex; flex-direction:column; gap:18px; }
        .auth-field { display:flex; flex-direction:column; gap:7px; }
        .auth-field label {
            font-size:10.5px !important; font-weight:700 !important;
            letter-spacing:.11em !important; text-transform:uppercase !important;
            color:#28384a !important; font-family:'Inter',sans-serif !important;
        }
        .auth-field-input { position:relative; display:flex; align-items:center; }
        .auth-input-icon {
            position:absolute; left:15px; color:#9aacc0;
            pointer-events:none; z-index:1;
        }
        .auth-field-input input {
            width:100%;
            padding:13px 14px 13px 44px !important;
            font-size:14px !important;
            border:1.5px solid #dce5f0 !important;
            border-radius:12px !important;
            background-color:#ffffff !important;
            color:#0a1220 !important;
            outline:none !important;
            box-shadow:0 1px 3px rgba(0,0,0,.04) !important;
            transition:border-color .18s,box-shadow .18s,background-color .18s;
            font-family:'Inter',sans-serif !important;
            box-sizing:border-box;
        }
        .auth-field-input input::placeholder { color:#a8b8cc; }
        .auth-field-input input:focus {
            border-color:#7898c0 !important;
            box-shadow:0 0 0 3px rgba(20,58,128,.07),0 1px 3px rgba(0,0,0,.04) !important;
            background-color:#fafcff !important;
        }
        .auth-submit {
            width:100% !important; padding:14.5px !important; margin-top:4px !important;
            background-color:#0a1220 !important; color:#ffffff !important;
            border:none !important; border-radius:12px !important;
            font-size:15px !important; font-weight:600 !important;
            letter-spacing:.03em !important; cursor:pointer !important;
            font-family:'Inter',sans-serif !important;
            transition:background-color .2s,box-shadow .2s !important;
            box-shadow:0 2px 8px rgba(10,18,32,.18) !important;
        }
        .auth-submit:hover {
            background-color:#182840 !important;
            box-shadow:0 4px 16px rgba(10,18,32,.28) !important;
        }
        .auth-submit:active { transform:translateY(1px); }

        .auth-form-links {
            display:flex; align-items:center; justify-content:center;
            gap:8px; margin-top:22px; font-size:13px; color:#6a7888;
            font-family:'Inter',sans-serif;
        }
        .auth-form-links a {
            color:#0a1220 !important; font-weight:700; text-decoration:none;
        }
        .auth-form-links a:hover { text-decoration:underline; }

        @media(max-width:960px) {
            .auth-panel-left { flex:0 0 47% !important; }
            .auth-panel-left-inner { padding:44px 44px !important; }
        }
        @media(max-width:720px) {
            .auth-split { flex-direction:column !important; }
            .auth-panel-left { flex:none !important; }
            .auth-panel-left-inner { min-height:auto; padding:36px 28px !important; }
            .auth-hero { padding:24px 0 20px; }
            .auth-hero-project   { font-size:48px !important; }
            .auth-hero-selection { font-size:56px !important; }
            .auth-hero-system    { font-size:42px !important; }
            .auth-panel-right { padding:36px 28px !important; }
        }
        @media(max-width:460px) {
            .auth-panel-left-inner { padding:28px 20px !important; }
            .auth-panel-right { padding:28px 18px !important; }
        }
    </style>
</head>
<body class="auth-body">

<div class="auth-split">

    <div class="auth-panel-left">
        <div class="auth-panel-left-inner">
            <header class="auth-brand-header">
                <span class="auth-institution-tag">XJTLU</span>
            </header>
            <main class="auth-hero">
                <h1 class="auth-hero-title">
                    <span class="auth-hero-project">Project</span>
                    <em class="auth-hero-selection">Selection</em>
                    <span class="auth-hero-system">System</span>
                </h1>
                <p class="auth-hero-desc">Securely recover access to your account. Your academic journey continues uninterrupted.</p>
            </main>
            <footer class="auth-panel-footer">
                <p class="auth-legal">© 2026 Xi'an Jiaotong-Liverpool University</p>
            </footer>
        </div>
    </div>

    <div class="auth-panel-right">
        <div class="auth-form-region">

            <div class="auth-form-accent">
                <span class="auth-form-accent-line"></span>
                <span class="auth-form-accent-text">Password Recovery</span>
            </div>

            <div class="auth-form-head">
                <h2>Forgot password?</h2>
                <p>Enter your registered email and we'll send you a reset link.</p>
            </div>

            <div th:if="${infoMessage}" class="auth-notice auth-notice-success">
                <svg xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="auth-notice-icon"><polyline points="20 6 9 17 4 12"/></svg>
                <span th:text="${infoMessage}">Message</span>
            </div>

            <form th:action="@{/forgot-password}" method="post" class="auth-form">

                <div class="auth-field">
                    <label for="email">Email Address</label>
                    <div class="auth-field-input">
                        <svg class="auth-input-icon" xmlns="http://www.w3.org/2000/svg" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="2" y="4" width="20" height="16" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
                        <input id="email" type="email" name="email"
                               placeholder="you@xjtlu.edu.cn"
                               autocomplete="email" required>
                    </div>
                </div>

                <button type="submit" class="auth-submit">Send reset link &rarr;</button>

            </form>

            <div class="auth-form-links">
                <a th:href="@{/login}">← Back to sign in</a>
            </div>

        </div>
    </div>

</div>

</body>
</html>
